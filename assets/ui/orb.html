<!DOCTYPE html>
<!-- Athena's chathead orb, colour-key edition.

     The window is made transparent by Win32 colour keying (LWA_COLORKEY in
     ui_orb.py): every pixel that is EXACTLY #010203 vanishes and clicks pass
     through it. So the body background must be exactly #010203, and glows
     must fade toward that near-black - never toward white - or they'd show
     as a box. Driven from Python via:
       window.setState('idle'|'listening'|'thinking'|'speaking'|'confirm')
       window.setAmplitude(0..1)      - mic/TTS level for bars and pulse
       window.showBubble(text)        - message bubble beside the orb
       window.measureBubble(text) -> px width the bubble needs (for sizing)
       window.setDock('left'|'right') - which screen edge we're snapped to -->
<html>
<head>
<meta charset="utf-8">
<title>Athena</title>
<style>
  html, body {
    margin: 0;
    height: 100%;
    background: #010203;   /* the key colour: rendered fully transparent */
    overflow: hidden;
    user-select: none;
    -webkit-user-select: none;
    cursor: default;
    font-family: "Segoe UI", sans-serif;
  }

  /* State colours (r,g,b). The whole look keys off --c. */
  body.state-idle      { --c: 120, 134, 156; }  /* dim slate  */
  body.state-listening { --c:  34, 211, 238; }  /* cyan       */
  body.state-thinking  { --c: 251, 191,  36; }  /* amber      */
  body.state-speaking  { --c:  52, 211, 153; }  /* green      */
  body.state-confirm   { --c: 251, 146,  60; }  /* orange     */

  /* ---------- the orb: pinned to the docked side ---------- */
  #orb-wrap {
    position: absolute;
    top: 50%;
    right: 8px;
    transform: translateY(-50%);
    width: 74px;
    height: 74px;
  }
  body.dock-left #orb-wrap { right: auto; left: 8px; }

  #orb {
    position: absolute;
    inset: 0;
    border-radius: 50%;
    background:
      radial-gradient(circle at 34% 28%,
        rgba(255,255,255,0.85) 0%,
        rgba(var(--c), 0.95) 26%,
        rgba(var(--c), 0.55) 60%,
        rgba(var(--c), 0.3) 100%);
    /* glow kept modest and dark-fading: colour-keyed edges leave only a
       faint dark fringe instead of a halo box */
    box-shadow:
      0 0 10px rgba(var(--c), 0.4),
      0 0 26px rgba(var(--c), 0.18),
      inset 0 0 16px rgba(1, 2, 3, 0.35);
    transition: box-shadow 0.8s ease;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  body.state-idle #orb { animation: breathe 4.5s ease-in-out infinite; }

  @keyframes breathe {
    0%, 100% { transform: scale(1);    filter: brightness(0.8); }
    50%      { transform: scale(1.05); filter: brightness(1); }
  }

  /* listening: 5 audio bars inside the orb, driven by setAmplitude */
  #bars { display: none; align-items: center; gap: 4px; height: 40px; }
  body.state-listening #bars { display: flex; }
  #bars div {
    width: 5px;
    border-radius: 3px;
    background: rgba(255, 255, 255, 0.92);
    height: 8px;
    transition: height 0.14s ease-out;   /* smooth, no jitter */
  }

  /* thinking: a thin arc spinning slowly around the orb */
  #arc {
    position: absolute;
    inset: -7px;
    border-radius: 50%;
    border: 2.5px solid transparent;
    border-top-color: rgba(var(--c), 0.95);
    border-right-color: rgba(var(--c), 0.35);
    opacity: 0;
    transition: opacity 0.5s ease;
  }
  body.state-thinking #arc { opacity: 1; animation: spin 1.8s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* speaking: soft rings pulsing outward */
  .ring {
    position: absolute;
    inset: 0;
    border-radius: 50%;
    border: 2px solid rgba(var(--c), 0.5);
    opacity: 0;
    pointer-events: none;
  }
  body.state-speaking .ring    { animation: ringPulse 2.2s ease-out infinite; }
  body.state-speaking .ring.r2 { animation-delay: 1.1s; }
  @keyframes ringPulse {
    0%   { transform: scale(1);   opacity: 0.55; }
    100% { transform: scale(1.5); opacity: 0; }
  }

  /* confirm: alert glyph, gentle attention pulse */
  #glyph {
    display: none;
    color: rgba(255, 255, 255, 0.95);
    font-size: 30px;
    font-weight: 600;
    text-shadow: 0 0 8px rgba(1, 2, 3, 0.5);
  }
  body.state-confirm #glyph { display: block; }
  body.state-confirm #orb   { animation: attention 1.6s ease-in-out infinite; }
  @keyframes attention {
    0%, 100% { transform: scale(1); }
    50%      { transform: scale(1.06); }
  }

  /* ---------- the message bubble, beside the orb ---------- */
  #bubble, #measure {
    max-width: 300px;
    background: #111827;         /* solid dark, well away from the key colour */
    color: #e5e7eb;
    font-size: 12.5px;
    line-height: 1.35;
    padding: 8px 12px;
    border-radius: 12px;
    border: 1px solid rgba(var(--c), 0.4);
    box-sizing: border-box;
  }
  #bubble {
    position: absolute;
    top: 50%;
    right: 96px;                 /* just left of the orb */
    transform: translateY(-50%) translateX(14px);
    opacity: 0;
    transition: opacity 0.5s ease, transform 0.5s cubic-bezier(.22,.9,.35,1);
    pointer-events: none;
  }
  body.dock-left #bubble {
    right: auto;
    left: 96px;                  /* orb on the left: bubble slides rightward */
    transform: translateY(-50%) translateX(-14px);
  }
  #bubble.show { opacity: 1; transform: translateY(-50%) translateX(0); }

  #measure {                     /* invisible twin used to measure text */
    position: absolute;
    visibility: hidden;
    white-space: pre-wrap;
    left: -9999px;
  }
</style>
</head>
<body class="state-idle dock-right">
  <div id="measure"></div>
  <div id="bubble"></div>
  <div id="orb-wrap">
    <div class="ring r1"></div>
    <div class="ring r2"></div>
    <div id="arc"></div>
    <div id="orb">
      <div id="bars"><div></div><div></div><div></div><div></div><div></div></div>
      <div id="glyph">!</div>
    </div>
  </div>

<script>
  var STATES = ["idle", "listening", "thinking", "speaking", "confirm"];
  var bubbleTimer = null;

  window.setState = function (state) {
    if (STATES.indexOf(state) === -1) { state = "idle"; }
    var dock = document.body.classList.contains("dock-left") ? "dock-left" : "dock-right";
    document.body.className = "state-" + state + " " + dock;
    return state;
  };

  window.setDock = function (side) {
    document.body.classList.toggle("dock-left", side === "left");
    document.body.classList.toggle("dock-right", side !== "left");
  };

  // Amplitude: Python sends a target 0..1; we ease toward it every frame so
  // the bars move smoothly even if updates arrive in bursts.
  var ampTarget = 0, amp = 0;
  window.setAmplitude = function (v) {
    ampTarget = Math.max(0, Math.min(1, Number(v) || 0));
  };

  var bars = document.querySelectorAll("#bars div");
  var mults = [0.55, 0.85, 1.0, 0.85, 0.55];   // centre bar tallest
  var orb = document.getElementById("orb");
  function tick(now) {
    amp += (ampTarget - amp) * 0.12;           // slow ease, no jitter
    for (var i = 0; i < bars.length; i++) {
      var wobble = 0.8 + 0.2 * Math.sin(now / 260 + i * 1.4);
      bars[i].style.height = (7 + amp * 30 * mults[i] * wobble) + "px";
    }
    if (document.body.classList.contains("state-speaking")) {
      orb.style.transform = "scale(" + (1 + amp * 0.1) + ")";
    } else if (!document.body.classList.contains("state-idle") &&
               !document.body.classList.contains("state-confirm")) {
      orb.style.transform = "scale(1)";
    }
    requestAnimationFrame(tick);
  }
  requestAnimationFrame(tick);

  // Width (px) the bubble needs for this text - Python uses it to size the
  // window before showing the bubble.
  window.measureBubble = function (text) {
    var m = document.getElementById("measure");
    m.textContent = String(text);
    return Math.ceil(m.getBoundingClientRect().width);
  };

  window.showBubble = function (text) {
    var b = document.getElementById("bubble");
    b.textContent = String(text);
    b.classList.add("show");
    if (bubbleTimer) { clearTimeout(bubbleTimer); }
    bubbleTimer = setTimeout(function () { b.classList.remove("show"); }, 6000);
  };

  // Manual dragging (pywebview's built-in drag is unreliable here).
  // mousedown on the orb starts a drag; every mousemove accumulates the
  // screen-coordinate delta and a rAF tick ships it to Python, which moves
  // the window by that amount. The browser keeps sending mousemove while
  // the button is held even if the cursor briefly leaves the window.
  var held = false, startX = 0, startY = 0, lastX = 0, lastY = 0;
  var downT = 0, dragged = false;
  var pendDx = 0, pendDy = 0, flushQueued = false;

  function flushMove() {
    flushQueued = false;
    if (!window.pywebview || !window.pywebview.api) { return; }
    if (pendDx !== 0 || pendDy !== 0) {
      var dx = pendDx, dy = pendDy;
      pendDx = 0; pendDy = 0;
      window.pywebview.api.move_window(dx, dy);
    }
  }

  function dbg(msg) {
    if (window.pywebview && window.pywebview.api && window.pywebview.api.debug) {
      window.pywebview.api.debug(msg);
    }
  }

  document.getElementById("orb-wrap").addEventListener("mousedown", function (e) {
    held = true; dragged = false;
    startX = lastX = e.screenX; startY = lastY = e.screenY;
    downT = Date.now();
    e.preventDefault();
    dbg("mousedown at screen (" + e.screenX + "," + e.screenY + ")");
  });

  document.addEventListener("mousemove", function (e) {
    if (!held) { return; }
    pendDx += e.screenX - lastX;
    pendDy += e.screenY - lastY;
    lastX = e.screenX; lastY = e.screenY;
    if (Math.hypot(e.screenX - startX, e.screenY - startY) >= 5) { dragged = true; }
    if (!flushQueued) { flushQueued = true; requestAnimationFrame(flushMove); }
  });

  document.addEventListener("mouseup", function (e) {
    if (!held) { return; }
    held = false;
    flushMove();
    var dist = Math.hypot(e.screenX - startX, e.screenY - startY);
    var dt = Date.now() - downT;
    // Click vs drag is decided ONLY by movement: if the pointer never moved
    // past the 5px threshold, it's a click - no matter how long it was held.
    // (The old code also required <300ms, so a slow still click fired
    //  nothing at all - that was the click-to-expand bug.)
    var kind = dragged ? "drag" : "click";
    dbg("mouseup dist=" + dist.toFixed(0) + "px dt=" + dt + "ms -> " + kind);
    if (!window.pywebview || !window.pywebview.api) { return; }
    if (dragged) {
      window.pywebview.api.drag_ended();       // snap to the nearest edge
    } else {
      window.pywebview.api.orb_clicked();      // a click -> expand
    }
  });
</script>
</body>
</html>
