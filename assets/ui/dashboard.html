<!DOCTYPE html>
<!-- Athena dashboard - dark HUD. Self-contained. Driven from Python via:
       setState(s)              idle|listening|thinking|speaking|confirm
       setAmplitude(v)          0..1 audio level (waveform + orb)
       addLogLine(text, tier)   tier: free|confirm|blocked -> coloured badge
       addTranscript(who, text) streams text character by character
       setStatus(obj)           {groq,supabase,mic,cpu,battery,stt,brain,tts}
       showConfirm(question)    approve / deny card
       openSessions()/closeSessions()  expand/collapse the left rail
     The transcript input calls window.onTypedInput(text) on Enter.
     The minimise control and the rail's orb button call pywebview.api.minimize(). -->
<html>
<head>
<meta charset="utf-8">
<title>Athena</title>
<style>
  :root {
    --bg: #05080c;
    --panel: #080d13;
    --accent: #4fd6e8;
    --line: rgba(79, 214, 232, 0.16);
    --line2: rgba(79, 214, 232, 0.3);
    --text: #c7d3dc;
    --dim: #5c6b78;
    --amber: #e8b94f;
    --red: #e85c5c;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; height: 100%;
    background: var(--bg);
    color: var(--text);
    font-family: "Cascadia Mono", "Consolas", monospace;
    font-size: 12px;
    overflow: hidden;
    user-select: none;
  }
  body { display: flex; flex-direction: column; }

  .label {
    font-size: 9px; letter-spacing: 0.22em; text-transform: uppercase;
    color: var(--dim);
  }

  /* ---------------- top bar ---------------- */
  #topbar {
    display: flex; align-items: center; justify-content: space-between;
    height: 44px; padding: 0 16px;
    border-bottom: 1px solid var(--line);
    flex: 0 0 auto;
  }
  .brand { display: flex; align-items: baseline; gap: 12px; }
  .word { color: var(--accent); font-size: 15px; letter-spacing: 0.5em; }
  .sub { font-size: 9px; letter-spacing: 0.2em; color: var(--dim); }
  .meta { display: flex; align-items: center; gap: 14px; font-size: 10px;
          letter-spacing: 0.15em; color: var(--dim); }
  .meta .sep { color: var(--line2); }
  #hud-state { color: var(--accent); }
  #minbtn {
    background: none; border: 1px solid var(--line); color: var(--dim);
    font: inherit; width: 24px; height: 20px; line-height: 1; cursor: pointer;
  }
  #minbtn:hover { color: var(--accent); border-color: var(--line2); }

  /* ---------------- main grid ---------------- */
  #main {
    flex: 1; display: grid;
    grid-template-columns: 44px 1fr 340px;
    gap: 14px; padding: 14px;
    min-height: 0;
    transition: grid-template-columns 0.25s ease;
  }
  body.rail-open #main { grid-template-columns: 200px 1fr 340px; }

  /* left rail */
  #rail {
    border: 1px solid var(--line);
    background: var(--panel);
    display: flex; flex-direction: column; gap: 2px;
    padding: 8px 0;
    overflow: hidden;
  }
  .railitem {
    display: flex; align-items: center; gap: 12px;
    padding: 10px 13px; cursor: pointer; white-space: nowrap;
    color: var(--dim); border-left: 2px solid transparent;
  }
  .railitem:hover { color: var(--accent); border-left-color: var(--line2); }
  .railitem .glyph { width: 16px; text-align: center; font-size: 13px; flex: 0 0 auto; }
  .railitem .name {
    font-size: 9px; letter-spacing: 0.22em; text-transform: uppercase;
    opacity: 0; transition: opacity 0.2s ease;
  }
  body.rail-open .railitem .name { opacity: 1; }
  #rail .spacer { flex: 1; }
  #sessions-list { display: none; padding: 6px 13px 10px 13px; }
  body.rail-open #sessions-list { display: block; }
  #sessions-list .label { margin-bottom: 8px; }
  #sessions-list .empty { color: var(--dim); font-size: 10px; }

  /* centre column */
  #centre {
    display: flex; flex-direction: column; align-items: center;
    justify-content: center; gap: 26px;
    border: 1px solid var(--line); background: var(--panel);
    position: relative; min-height: 0;
  }

  /* panels get L-shaped corner brackets */
  .cornered { position: relative; }
  .cornered::before, .cornered::after {
    content: ""; position: absolute; width: 12px; height: 12px;
  }
  .cornered::before {
    top: -1px; left: -1px;
    border-top: 1px solid var(--accent); border-left: 1px solid var(--accent);
  }
  .cornered::after {
    bottom: -1px; right: -1px;
    border-bottom: 1px solid var(--accent); border-right: 1px solid var(--accent);
  }

  /* the big orb: concentric rings, slow rotation */
  #orb-box { width: 240px; height: 240px; position: relative; }
  #orb-box svg { width: 100%; height: 100%; }
  .ring { transform-origin: 50% 50%; }
  .r-outer { animation: rot 46s linear infinite; }
  .r-mid   { animation: rot 30s linear infinite reverse; }
  .r-inner { animation: rot 18s linear infinite; }
  body.state-thinking .r-outer { animation-duration: 7s; }
  body.state-thinking .r-mid   { animation-duration: 5s; }
  body.state-thinking .r-inner { animation-duration: 3s; }
  body.state-listening .r-inner { animation-duration: 8s; }
  @keyframes rot { to { transform: rotate(360deg); } }
  #core { transform-origin: 50% 50%; }
  body.state-idle #core { animation: corebreathe 4.5s ease-in-out infinite; }
  @keyframes corebreathe { 0%,100% { opacity: 0.55; } 50% { opacity: 1; } }

  /* state pill */
  #pill {
    border: 1px solid var(--line2); color: var(--accent);
    padding: 6px 22px; font-size: 10px; letter-spacing: 0.35em;
    text-transform: uppercase;
  }
  body.state-confirm #pill { color: var(--amber); border-color: rgba(232,185,79,0.4); }

  /* waveform */
  #wave { width: 320px; height: 48px; }

  /* confirm card */
  #confirm {
    display: none; position: absolute; bottom: 26px; left: 50%;
    transform: translateX(-50%);
    width: 380px; max-width: 86%;
    background: var(--bg); border: 1px solid rgba(232,185,79,0.4);
    padding: 14px 16px;
  }
  #confirm.show { display: block; }
  #confirm .label { color: var(--amber); margin-bottom: 8px; }
  #confirm-q { font-size: 12px; line-height: 1.5; margin-bottom: 12px; }
  #confirm .buttons { display: flex; gap: 10px; }
  #confirm button {
    flex: 1; background: none; font: inherit; font-size: 10px;
    letter-spacing: 0.25em; text-transform: uppercase;
    padding: 7px 0; cursor: pointer;
  }
  #btn-approve { border: 1px solid rgba(79,214,232,0.4); color: var(--accent); }
  #btn-approve:hover { background: rgba(79,214,232,0.08); }
  #btn-deny { border: 1px solid var(--line); color: var(--dim); }
  #btn-deny:hover { border-color: rgba(232,92,92,0.5); color: var(--red); }

  /* right column */
  #side { display: flex; flex-direction: column; gap: 14px; min-height: 0; }
  .panel {
    border: 1px solid var(--line); background: var(--panel);
    display: flex; flex-direction: column; min-height: 0;
  }
  #panel-log { flex: 2; }
  #panel-chat { flex: 3; }
  .panel .head {
    padding: 10px 14px; border-bottom: 1px solid var(--line); flex: 0 0 auto;
  }
  .panel .body { flex: 1; overflow-y: auto; padding: 10px 14px; min-height: 0; }
  .panel .body::-webkit-scrollbar { width: 4px; }
  .panel .body::-webkit-scrollbar-thumb { background: var(--line2); }

  /* tool log */
  .logline { display: flex; gap: 8px; margin-bottom: 7px; align-items: baseline; }
  .badge {
    flex: 0 0 auto; font-size: 8px; letter-spacing: 0.18em; padding: 2px 6px;
    text-transform: uppercase;
  }
  .badge.free    { color: var(--accent); border: 1px solid rgba(79,214,232,0.4); }
  .badge.confirm { color: var(--amber);  border: 1px solid rgba(232,185,79,0.4); }
  .badge.blocked { color: var(--red);    border: 1px solid rgba(232,92,92,0.4); }
  .logline .txt { color: var(--text); font-size: 11px; line-height: 1.4; }
  .logline .t { color: var(--dim); font-size: 9px; flex: 0 0 auto; }

  /* transcript */
  .msg { margin-bottom: 10px; }
  .msg .who { margin-bottom: 3px; }
  .msg.athena .who { color: var(--accent); }
  .msg .text { font-size: 11.5px; line-height: 1.5; white-space: pre-wrap; }
  .msg .text .caret { color: var(--accent); }
  #chat-inputrow {
    flex: 0 0 auto; border-top: 1px solid var(--line);
    display: flex; align-items: center; gap: 8px; padding: 8px 12px;
  }
  #chat-inputrow .prompt { color: var(--accent); }
  #chat-input {
    flex: 1; background: none; border: none; outline: none;
    color: var(--text); font: inherit; font-size: 11.5px;
  }

  /* ---------------- bottom strip ---------------- */
  #statusbar {
    flex: 0 0 auto; height: 32px;
    border-top: 1px solid var(--line);
    display: flex; align-items: center; gap: 22px;
    padding: 0 16px; font-size: 9px; letter-spacing: 0.18em;
    text-transform: uppercase; color: var(--dim);
  }
  .dot {
    display: inline-block; width: 6px; height: 6px; border-radius: 50%;
    background: #2a333c; margin-right: 6px; vertical-align: middle;
  }
  .dot.on { background: var(--accent); }
  .dot.off { background: var(--red); }
  #statusbar .grow { flex: 1; }
  #latency span { color: var(--text); }
</style>
</head>
<body class="state-idle">

  <header id="topbar" class="pywebview-drag-region">
    <div class="brand">
      <span class="word">ATHENA</span>
      <span class="sub">// WINDOWS VOICE ASSISTANT</span>
    </div>
    <div class="meta">
      <span id="hud-state">AWAITING</span><span class="sep">|</span>
      <span id="hud-wake">WAKE: HEY ATHENA</span><span class="sep">|</span>
      <span id="clock">--:--:--</span>
      <button id="minbtn" title="collapse to orb">&ndash;</button>
    </div>
  </header>

  <div id="main">
    <nav id="rail">
      <div class="railitem" onclick="toggleRail()">
        <span class="glyph">&#9636;</span><span class="name">Sessions</span>
      </div>
      <div id="sessions-list">
        <div class="label">Sessions</div>
        <div class="empty">&mdash; none yet &mdash;</div>
      </div>
      <div class="railitem"><span class="glyph">&#9671;</span><span class="name">Plans</span></div>
      <div class="railitem"><span class="glyph">&#9672;</span><span class="name">Memory</span></div>
      <div class="railitem"><span class="glyph">&#10022;</span><span class="name">Settings</span></div>
      <div class="spacer"></div>
      <div class="railitem" onclick="minimize()">
        <span class="glyph">&#9675;</span><span class="name">Orb mode</span>
      </div>
    </nav>

    <section id="centre" class="cornered">
      <div id="orb-box">
        <svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
          <g class="ring r-outer">
            <circle cx="120" cy="120" r="104" fill="none"
              stroke="rgba(79,214,232,0.28)" stroke-width="1"
              stroke-dasharray="140 30 8 30 220 30"/>
          </g>
          <g class="ring r-mid">
            <circle cx="120" cy="120" r="82" fill="none"
              stroke="rgba(79,214,232,0.45)" stroke-width="1"
              stroke-dasharray="90 26 6 26 160 26"/>
          </g>
          <g class="ring r-inner">
            <circle cx="120" cy="120" r="60" fill="none"
              stroke="rgba(79,214,232,0.6)" stroke-width="1.5"
              stroke-dasharray="55 20 4 20 100 20"/>
          </g>
          <circle id="core" cx="120" cy="120" r="16" fill="rgba(79,214,232,0.85)"/>
          <circle cx="120" cy="120" r="4" fill="#05080c"/>
        </svg>
      </div>
      <div id="pill">Awaiting</div>
      <canvas id="wave" width="320" height="48"></canvas>

      <div id="confirm" class="cornered">
        <div class="label">Confirmation required</div>
        <div id="confirm-q"></div>
        <div class="buttons">
          <button id="btn-approve" onclick="answerConfirm(true)">Approve</button>
          <button id="btn-deny" onclick="answerConfirm(false)">Deny</button>
        </div>
      </div>
    </section>

    <aside id="side">
      <div class="panel cornered" id="panel-log">
        <div class="head label">Tool log</div>
        <div class="body" id="log"></div>
      </div>
      <div class="panel cornered" id="panel-chat">
        <div class="head label">Transcript</div>
        <div class="body" id="chat"></div>
        <div id="chat-inputrow">
          <span class="prompt">&gt;</span>
          <input id="chat-input" autocomplete="off" spellcheck="false"
                 placeholder="type to athena...">
        </div>
      </div>
    </aside>
  </div>

  <footer id="statusbar">
    <span><i class="dot" id="dot-groq"></i>groq</span>
    <span><i class="dot" id="dot-supabase"></i>supabase</span>
    <span><i class="dot" id="dot-mic"></i>mic</span>
    <span class="grow"></span>
    <span id="stat-cpu">CPU --%</span>
    <span id="stat-bat">BAT --%</span>
    <span id="latency">STT <span id="lat-stt">-</span> / BRAIN <span id="lat-brain">-</span> / TTS <span id="lat-tts">-</span></span>
  </footer>

<script>
  var STATES = ["idle", "listening", "thinking", "speaking", "confirm"];
  var PILL = { idle: "Awaiting", listening: "Listening", thinking: "Thinking",
               speaking: "Speaking", confirm: "Confirm" };

  window.setState = function (s) {
    if (STATES.indexOf(s) === -1) { s = "idle"; }
    document.body.className =
      "state-" + s + (document.body.classList.contains("rail-open") ? " rail-open" : "");
    document.getElementById("pill").textContent = PILL[s];
    document.getElementById("hud-state").textContent = PILL[s].toUpperCase();
    // the confirm card is shown/hidden explicitly, not tied to state
    return s;
  };

  /* ---- amplitude + waveform ---- */
  var ampTarget = 0, amp = 0;
  window.setAmplitude = function (v) {
    ampTarget = Math.max(0, Math.min(1, Number(v) || 0));
  };
  var wave = document.getElementById("wave").getContext("2d");
  function drawWave(now) {
    amp += (ampTarget - amp) * 0.12;
    wave.clearRect(0, 0, 320, 48);
    wave.fillStyle = "rgba(79,214,232,0.8)";
    var n = 48, bw = 3, gap = 320 / n;
    for (var i = 0; i < n; i++) {
      var centre = 1 - Math.abs(i - n / 2) / (n / 2);      // taller mid-screen
      var wob = 0.55 + 0.45 * Math.sin(now / 300 + i * 0.9);
      var h = 2 + amp * 40 * centre * wob;
      wave.fillRect(i * gap, 24 - h / 2, bw, h);
    }
    // core dot follows the level too
    document.getElementById("core").setAttribute("r", 16 + amp * 6);
    requestAnimationFrame(drawWave);
  }
  requestAnimationFrame(drawWave);

  /* ---- tool log ---- */
  window.addLogLine = function (text, tier, timestamp) {
    tier = ["free", "confirm", "blocked"].indexOf(tier) !== -1 ? tier : "free";
    var box = document.getElementById("log");
    var row = document.createElement("div");
    row.className = "logline";
    var t = timestamp || new Date().toTimeString().slice(0, 8);
    row.innerHTML = '<span class="t">' + t + '</span>' +
                    '<span class="badge ' + tier + '">' + tier + "</span>";
    var txt = document.createElement("span");
    txt.className = "txt";
    txt.textContent = String(text);
    row.appendChild(txt);
    box.appendChild(row);
    while (box.children.length > 200) { box.removeChild(box.firstChild); }
    box.scrollTop = box.scrollHeight;
  };

  /* ---- transcript, streamed character by character ----
     Consecutive entries from the same speaker merge into one block, so a
     reply arriving sentence-by-sentence doesn't repeat the ATHENA label. */
  window.addTranscript = function (who, text, instant) {
    var box = document.getElementById("chat");
    var isAthena = String(who).toLowerCase().indexOf("athena") === 0;
    var last = box.lastElementChild;
    var msg;
    if (last && last.classList.contains("msg") &&
        last.classList.contains("athena") === isAthena) {
      msg = last;
    } else {
      msg = document.createElement("div");
      msg.className = "msg" + (isAthena ? " athena" : "");
      msg.innerHTML = '<div class="who label">' + (isAthena ? "Athena" : "You") + "</div>";
      box.appendChild(msg);
    }
    var span = document.createElement("div");
    span.className = "text";
    msg.appendChild(span);
    var full = String(text);
    if (instant) {                 // replayed history: no typing animation
      span.textContent = full;
      box.scrollTop = box.scrollHeight;
      return;
    }
    var i = 0;
    var timer = setInterval(function () {
      i += 1;
      span.textContent = full.slice(0, i);
      if (i < full.length) { span.innerHTML += '<span class="caret">_</span>'; }
      box.scrollTop = box.scrollHeight;
      if (i >= full.length) { clearInterval(timer); }
    }, 14);
  };

  /* ---- state replay after a mode switch ----
     The Python side owns the history; when this page (re)loads it hands
     everything back in one call so nothing is lost by switching modes. */
  window.__replay = function (data) {
    data = data || {};
    if (data.state) { setState(data.state); }
    if (data.status) { setStatus(data.status); }
    (data.log || []).forEach(function (e) { addLogLine(e[0], e[1], e[2]); });
    (data.chat || []).forEach(function (m) { addTranscript(m[0], m[1], true); });
    if (data.confirm) { showConfirm(data.confirm); }
  };

  /* ---- bottom status strip ---- */
  function setDot(id, val) {
    var d = document.getElementById(id);
    d.className = "dot " + (val ? "on" : "off");
  }
  window.setStatus = function (o) {
    o = o || {};
    if ("groq" in o) { setDot("dot-groq", o.groq); }
    if ("supabase" in o) { setDot("dot-supabase", o.supabase); }
    if ("mic" in o) { setDot("dot-mic", o.mic); }
    if ("cpu" in o) { document.getElementById("stat-cpu").textContent = "CPU " + Math.round(o.cpu) + "%"; }
    if ("battery" in o) { document.getElementById("stat-bat").textContent = "BAT " + Math.round(o.battery) + "%"; }
    if ("stt" in o) { document.getElementById("lat-stt").textContent = Number(o.stt).toFixed(2) + "s"; }
    if ("brain" in o) { document.getElementById("lat-brain").textContent = Number(o.brain).toFixed(2) + "s"; }
    if ("tts" in o) { document.getElementById("lat-tts").textContent = Number(o.tts).toFixed(2) + "s"; }
  };

  /* ---- confirm card ---- */
  window.showConfirm = function (question) {
    document.getElementById("confirm-q").textContent = String(question);
    document.getElementById("confirm").classList.add("show");
  };
  window.hideConfirm = function () {
    document.getElementById("confirm").classList.remove("show");
  };
  function answerConfirm(ans) {
    hideConfirm();
    if (window.pywebview && window.pywebview.api) {
      window.pywebview.api.confirm_answer(!!ans);
    }
  }

  /* ---- left rail ---- */
  window.openSessions = function () { document.body.classList.add("rail-open"); };
  window.closeSessions = function () { document.body.classList.remove("rail-open"); };
  function toggleRail() {
    document.body.classList.contains("rail-open") ? closeSessions() : openSessions();
  }

  /* ---- typed input ---- */
  window.onTypedInput = function (text) {   // overridable; default -> Python
    if (window.pywebview && window.pywebview.api) {
      window.pywebview.api.typed_input(text);
    }
  };
  document.getElementById("chat-input").addEventListener("keydown", function (e) {
    if (e.key === "Enter" && this.value.trim()) {
      window.onTypedInput(this.value.trim());
      this.value = "";
    }
  });

  function minimize() {
    if (window.pywebview && window.pywebview.api) { window.pywebview.api.minimize(); }
  }
  document.getElementById("minbtn").addEventListener("click", minimize);

  // Escape collapses back to the orb (unless you're typing a message).
  document.addEventListener("keydown", function (e) {
    if (e.key === "Escape") {
      var input = document.getElementById("chat-input");
      if (document.activeElement === input && input.value) {
        input.value = "";           // first Esc clears the draft
      } else {
        minimize();
      }
    }
  });

  /* ---- clock ---- */
  function tickClock() {
    document.getElementById("clock").textContent = new Date().toTimeString().slice(0, 8);
  }
  tickClock();
  setInterval(tickClock, 1000);
</script>
</body>
</html>
